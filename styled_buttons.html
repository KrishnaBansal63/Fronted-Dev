<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Styled Buttons</title>
  <link rel="stylesheet" href="styled_buttons.css">
</head>
<body>
  <main class="container">
    <h1>Button Styles</h1>
    <section class="row">
      <button class="btn primary">Primary</button>
      <button class="btn secondary">Secondary</button>
      <button class="btn outline">Outline</button>
      <button class="btn disabled" disabled>Disabled</button>
    </section>
    <p style="margin-top:12px;color:#555">Hover to lift; active to press; focus shows ring; disabled uses :disabled.</p>
  </main>
</body>
</html>
