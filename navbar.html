<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar with Transitions</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navigation Bar */
    nav {
      background-color: #007bff;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 15px 0;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 10px 20px;
      padding: 10px 16px;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    nav a:hover {
      background-color: #0056b3;
      transform: scale(1.1);
    }

    nav a.active {
      background-color: white;
      color: #007bff;
      border: 2px solid #007bff;
    }

    /* Responsive Design */
    @media (max-width: 700px) {
      nav {
        flex-direction: column;
        align-items: center;
      }

      nav a {
        width: 80%;
        text-align: center;
      }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 15px 0;
      background-color: #e9ecef;
      margin-top: auto;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="active">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </nav>

  <footer>
    © 2025 Navigation Bar Demo | Created for CSS Practice
  </footer>

</body>
</html>
