<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UI Components</title>
<link rel="stylesheet" href="ui_components.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>UI Components</h1>
    </header>
    <div class="controls">
      <input class="search" type="search" placeholder="Search...">
      <select class="select"><option>All</option><option>Articles</option></select>
      <button class="btn">Search</button>
    </div>
    <section class="card">
      <img src="https://source.unsplash.com/80x80?avatar" alt="avatar">
      <div>
        <h3>Item Title</h3>
        <p style="color:#666">Short description here</p>
      </div>
      <div style="margin-left:auto">
        <button class="btn">Action</button>
      </div>
    </section>
  </main>
</body>
</html>
