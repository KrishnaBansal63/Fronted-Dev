<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications Dashboard - Q6</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q6_notifications.css">
  </head>
  <body>
    <header class="bg-white border-bottom py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Notifications</h4>
        <small class="text-muted">Dashboard panel</small>
      </div>
    </header>

    <main class="container py-4">
      <!-- Alerts section -->
      <section class="mb-4">
        <div class="alert alert-success" role="alert">
          <strong>Success!</strong> Your settings were saved.
        </div>

        <div class="alert alert-info" role="alert">
          <strong>Tip:</strong> Use the dashboard to monitor activity.
        </div>

        <div class="alert alert-danger" role="alert">
          <strong>Warning!</strong> Your subscription is expiring soon.
        </div>

        <!-- Dismissible alert -->
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          <strong>Heads up:</strong> We recommend reviewing your profile.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      </section>

      <!-- Summary 'well' -->
      <section>
        <div class="card p-3">
          <div class="bg-light border rounded p-3">
            <h5 class="mb-2">Summary</h5>
            <p class="mb-1">New messages: <strong>3</strong></p>
            <p class="mb-0">Pending tasks: <strong>5</strong></p>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
