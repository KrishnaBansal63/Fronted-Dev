<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio - Q2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2_portfolio_basics.css">
  </head>
  <body class="bg-light">
    <header class="container text-center py-5">
      <h1 class="fw-bold">Krishna Bansal</h1>
      <p class="lead text-muted">Frontend Developer • UI Enthusiast</p>
    </header>

    <main class="container text-center">
      <div class="row justify-content-center">
        <div class="col-10 col-md-4">
          <!-- profile image using Bootstrap utilities -->
          <img src="https://picsum.photos/300" class="img-fluid rounded-circle mb-3" alt="Profile">
          <p class="mb-3">I build responsive web interfaces with modern CSS and accessibility in mind.</p>
          <div class="d-flex justify-content-center gap-2 mb-3">
            <a class="btn btn-primary" href="#">Hire Me</a>
            <a class="btn btn-outline-secondary" href="#">Download CV</a>
          </div>

          <!-- simple contact form -->
          <form class="text-start">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="3" placeholder="Let's talk about your project"></textarea>
            </div>
            <button class="btn btn-success">Send</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="container text-center py-4">
      <small class="text-muted">Made with Bootstrap utilities</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
