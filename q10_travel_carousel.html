<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Travel Agency - Q10</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q10_travel_carousel.css">
  </head>
  <body>
    <header class="bg-white border-bottom py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="mb-0">ExploreWorld Travel</h4>
      </div>
    </header>

    <main class="container py-4">
      <!-- Carousel -->
      <div id="destCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="2000">
            <img src="https://picsum.photos/1200/500?dest1" class="d-block w-100" alt="Destination 1">
            <div class="carousel-caption d-none d-md-block">
              <h5>Tropical Paradise</h5>
              <p>Relax on white sandy beaches.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="2000">
            <img src="https://picsum.photos/1200/500?dest2" class="d-block w-100" alt="Destination 2">
            <div class="carousel-caption d-none d-md-block">
              <h5>Mountain Escape</h5>
              <p>Hike scenic trails and unwind.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="2000">
            <img src="https://picsum.photos/1200/500?dest3" class="d-block w-100" alt="Destination 3">
            <div class="carousel-caption d-none d-md-block">
              <h5>Historic City</h5>
              <p>Explore culture and architecture.</p>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#destCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#destCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <!-- Progress bar for booking completion -->
      <div class="mt-4">
        <h5>Booking Completion</h5>
        <div class="progress" style="height: 1.25rem;">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">70%</div>
        </div>
      </div>
    </main>

    <footer class="bg-light py-4 mt-4">
      <div class="container text-center">
        <p class="mb-0">Contact us: travel@example.com • (555) 987-6543</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
