<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q5 – Team Members Directory</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
    body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
        color: #333;
    }

    h2 {
        margin-bottom: 20px;
        font-weight: 600;
    }

    .controls {
        margin-bottom: 20px;
    }

    button {
        background: #ffffff;
        border: 1px solid #ccd6e0;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    button:hover {
        background: #eef3f7;
    }

    .department {
        background: #ffffff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .dept-header {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
        cursor: pointer;
        padding: 10px 0;
    }

    .dept-header:hover {
        color: #005bbb;
    }

    .members {
        margin-top: 10px;
    }

    .member {
        background: #f7f9fc;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 8px;
        transition: 0.2s;
    }

    .manager {
        background: #e8f1ff !important;
        cursor: pointer;
    }

    .member:hover {
        background: #eef3f7;
    }

    .highlight {
        background: #fff4cc !important;
        border-left: 4px solid #ffcb42;
    }

    .sibling-highlight {
        outline: 2px dashed #7bb6ff;
    }

    .contactBlock {
        font-size: 13px;
        margin-left: 15px;
        padding: 5px 0;
        display: none;
        color: #333;
    }

</style>
</head>
<body>

<h2>Team Members Directory</h2>

<div class="controls">
    <button id="randomEmployeeBtn">Highlight Random Employee Siblings</button>
    <button id="toggleAllBtn">Collapse / Expand All Teams</button>
</div>

<!-- ===== Engineering Dept ===== -->
<div class="department">
    <div class="dept-header">
        <span class="dept-title">Engineering Department</span>
        <small>Click manager to highlight direct reports</small>
    </div>

    <div class="members">
        <div class="member manager">Alice (Manager)</div>
        <div class="reports">
            <div class="member employee">Bob</div>
            <div class="member employee">Carol</div>
            <div class="member employee">Dave</div>
        </div>
    </div>
</div>

<!-- ===== Design Dept ===== -->
<div class="department">
    <div class="dept-header">
        <span class="dept-title">Design Department</span>
        <small>Hover employee to view contact</small>
    </div>

    <div class="members">
        <div class="member manager">Eve (Manager)</div>
        <div class="reports">
            <div class="member employee">Frank</div>
            <div class="member employee">Grace</div>
        </div>
    </div>
</div>

<!-- ===== Marketing Dept ===== -->
<div class="department">
    <div class="dept-header">
        <span class="dept-title">Marketing Department</span>
    </div>

    <div class="members">
        <div class="member manager">Hector (Manager)</div>
        <div class="reports">
            <div class="member employee">Ivy</div>
            <div class="member employee">John</div>
            <div class="member employee">Kara</div>
        </div>
    </div>
</div>

<script>
$(function () {

    // 1. Manager → highlight direct reports
    $(".manager").click(function () {
        $(this).next(".reports").find(".employee").toggleClass("highlight");
    });

    // 2. Hover employee → show contact (using .next())
    $(".employee").each(function () {
        const $contact = $("<div class='contactBlock'>Email: example@company.com</div>");
        $(this).after($contact);
    });

    $(".employee").hover(
        function () { $(this).next(".contactBlock").slideDown(120); },
        function () { $(this).next(".contactBlock").slideUp(120); }
    );

    // 3. Click dept → change background of all members (.children())
    $(".dept-title").click(function () {
        $(this)
            .parent()
            .parent()
            .children(".members")
            .children()
            .find(".member")
            .css("background", "#eaf7ff");
    });

    // 4. Random employee → highlight siblings
    $("#randomEmployeeBtn").click(function () {
        let employees = $(".employee");
        let randIndex = Math.floor(Math.random() * employees.length);
        let chosen = employees.eq(randIndex);

        $(".sibling-highlight").removeClass("sibling-highlight");
        chosen.siblings(".employee").addClass("sibling-highlight");
    });

    // 5. Collapse / Expand teams
    $(".dept-header").click(function () {
        $(this).parent().find(".members").slideToggle(200);
    });

});
</script>

</body>
</html>
