<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Menu - Q4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q4_restaurant_menu.css">
  </head>
  <body>
    <header class="bg-light py-4 text-center">
      <div class="container">
        <h1 class="display-6">Today's Menu</h1>
        <p class="lead text-muted">Fresh, seasonal, and delicious</p>
      </div>
    </header>

    <main class="container py-5">
      <div class="row">
        <div class="col-md-8">
          <!-- Bootstrap table for menu items -->
          <table class="table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Category</th>
                <th class="text-end">Price</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Grilled Salmon</td>
                <td>Main</td>
                <td class="text-end">$18</td>
              </tr>
              <tr>
                <td>Roasted Vegetable Salad</td>
                <td>Starter</td>
                <td class="text-end">$9</td>
              </tr>
              <tr>
                <td>Chocolate Lava Cake</td>
                <td>Dessert</td>
                <td class="text-end">$7</td>
              </tr>
            </tbody>
          </table>
        </div>

        <aside class="col-md-4">
          <div class="mb-4">
            <h5>Chef's Specials</h5>
            <ul class="list-group">
              <li class="list-group-item">Pumpkin Risotto</li>
              <li class="list-group-item">Citrus Cured Trout</li>
              <li class="list-group-item">Herb Crusted Lamb</li>
            </ul>
          </div>

          <figure class="figure">
            <img src="https://picsum.photos/500/300?food" class="figure-img img-fluid rounded" alt="Food">
            <figcaption class="figure-caption text-muted">Our signature dish - seasonal ingredients.</figcaption>
          </figure>

        </aside>
      </div>
    </main>

    <footer class="text-center py-4 bg-light">
      <small class="text-muted">Reserve your table at (555) 123-4567</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
