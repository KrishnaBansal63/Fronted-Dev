<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Themed Blog - Q5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="q5_custom_blog.css">
  </head>
  <body>
    <header class="py-4 text-center">
      <div class="container">
        <h1 class="fw-bold">Coral & Teal Blog</h1>
        <p class="text-muted">Personal notes on UI, CSS, and design systems</p>
      </div>
    </header>

    <main class="container">
      <div class="row g-4">
        <div class="col-md-6">
          <article class="card p-3">
            <h3 class="card-title">Designing for Scale</h3>
            <p class="card-text">How to think about components, tokens, and design decisions that stay consistent.</p>
            <a class="btn btn-primary" href="#">Read more</a>
          </article>
        </div>

        <div class="col-md-6">
          <article class="card p-3">
            <h3 class="card-title">Accessible Forms</h3>
            <p class="card-text">Small practices that make big accessibility improvements.</p>
            <a class="btn btn-primary" href="#">Read more</a>
          </article>
        </div>
      </div>
    </main>

    <footer class="text-center py-4 mt-5">
      <small class="text-muted">© 2025 Coral & Teal</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
