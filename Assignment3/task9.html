<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
</head>
<body>
    <form>
        <label>Upload Image:</label>
        <input type="file" name="image" accept=".jpg, .png" required><br><br>
        <p>Only JPG or PNG files are allowed.</p>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
