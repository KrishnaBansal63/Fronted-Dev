<!DOCTYPE html>
<html>
<head>
    <title>Dropdown Selection</title>
</head>
<body>
    <h1>Choose Your Travel Preferences</h1>

    <form>
        <label>Country:
            <select>
                <option selected>India</option>
                <option>Japan</option>
                <option>France</option>
            </select>
        </label>
        <br><br>

        <label>State:
            <select>
                <option selected>Delhi</option>
                <option>Maharashtra</option>
                <option>Tamil Nadu</option>
            </select>
        </label>
        <br><br>

        <label>City:
            <select>
                <option selected>New Delhi</option>
                <option>Mumbai</option>
                <option>Chennai</option>
            </select>
        </label>
        <br><br>

        <label>Favorite Tourist Place:
            <select>
                <option selected>Taj Mahal</option>
                <option>India Gate</option>
                <option>Gateway of India</option>
            </select>
        </label>
    </form>

    <p>I love exploring <strong>India</strong>, especially <em>New Delhi</em> and the beautiful <mark>Taj Mahal</mark>.</p>
</body>
</html>
