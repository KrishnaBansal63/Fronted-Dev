<!DOCTYPE html>
<html>
<head>
    <title>Course Registration Form</title>
</head>
<body>
    <h1>Course Registration</h1>
    <form>
        <fieldset>
            <legend>Student Details</legend>
            <label>Name: <input type="text" name="name"></label><br><br>
            <label>Email: <input type="email" name="email"></label><br><br>
            <label>Course:
                <select name="course">
                    <option selected>Select a Course</option>
                    <option>Web Development</option>
                    <option>Machine Learning</option>
                    <option>AI Fundamentals</option>
                </select>
            </label>
        </fieldset>

        <h2>Available Course Schedules</h2>
        <table border="1">
            <tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
            <tr><td>Monday</td><td>10:00 AM</td><td>Dr. Sharma</td></tr>
            <tr><td>Wednesday</td><td>2:00 PM</td><td>Prof. Mehta</td></tr>
        </table>
    </form>
</body>
</html>
