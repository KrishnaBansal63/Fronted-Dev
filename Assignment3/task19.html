<!DOCTYPE html>
<html>
<head>
    <title>Form Security Example</title>
</head>
<body>
    <form autocomplete="off">
        <label>Username: <input type="text" required></label><br><br>
        <label>Password: <input type="password" required></label><br><br>
        <input type="submit" value="Login">
    </form>
    <p>Note: Turning off autocomplete prevents browsers from storing sensitive data for security reasons.</p>
</body>
</html>
