<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="image_showcase.css">
</head>
<body>
  <main class="container">
    <h1>Image Showcase</h1>
    <section class="grid">
      <figure class="card"><img src="https://source.unsplash.com/600x400?nature,1" alt="img1"><div class="overlay"></div><figcaption>Nature</figcaption></figure>
      <figure class="card"><img src="https://source.unsplash.com/600x400?city,2" alt="img2"><div class="overlay"></div><figcaption>City</figcaption></figure>
      <figure class="card"><img src="https://source.unsplash.com/600x400?travel,3" alt="img3"><div class="overlay"></div><figcaption>Travel</figcaption></figure>
      <figure class="card"><img src="https://source.unsplash.com/600x400?food,4" alt="img4"><div class="overlay"></div><figcaption>Food</figcaption></figure>
      <figure class="card"><img src="https://source.unsplash.com/600x400?animals,5" alt="img5"><div class="overlay"></div><figcaption>Animals</figcaption></figure>
      <figure class="card"><img src="https://source.unsplash.com/600x400?art,6" alt="img6"><div class="overlay"></div><figcaption>Art</figcaption></figure>
    </section>
  </main>
</body>
</html>
