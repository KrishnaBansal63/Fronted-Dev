<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Q1 - Image Filter Gallery</title>
<link rel="stylesheet" href="q1_image_filter_gallery.css">
</head>
<body>
<main class="container">
  <h1>Responsive Image Filter Gallery</h1>
  <section class="gallery">
    <figure class="card blur"><img src="https://source.unsplash.com/600x400?nature,1" alt="nature"><figcaption class="caption">Blur</figcaption></figure>
    <figure class="card gray"><img src="https://source.unsplash.com/600x400?city,2" alt="city"><figcaption class="caption">Grayscale</figcaption></figure>
    <figure class="card sepia"><img src="https://source.unsplash.com/600x400?travel,3" alt="travel"><figcaption class="caption">Sepia</figcaption></figure>
    <figure class="card bright"><img src="https://source.unsplash.com/600x400?food,4" alt="food"><figcaption class="caption">Brightness</figcaption></figure>
    <figure class="card contrast"><img src="https://source.unsplash.com/600x400?animals,5" alt="animals"><figcaption class="caption">Contrast</figcaption></figure>
    <figure class="card hue"><img src="https://source.unsplash.com/600x400?art,6" alt="art"><figcaption class="caption">Hue-Rotate</figcaption></figure>
  </section>
</main>
</body>
</html>
