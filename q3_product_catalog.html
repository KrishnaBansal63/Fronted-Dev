<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Catalog - Q3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q3_product_catalog.css">
  </head>
  <body>
    <header class="bg-dark text-white py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Shop</h4>
        <div>Products</div>
      </div>
    </header>

    <main class="py-5">
      <div class="container">
        <div class="row">
          <!-- Use col-md-3 for 4-column on desktop, col-sm-6 for 2 on tablet, full on mobile -->
          <div class="col-12 col-sm-6 col-md-3 mb-4">
            <div class="card h-100 shadow-sm product-card">
              <img src="https://picsum.photos/400/300?prod1" class="card-img-top" alt="Product 1">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Product 1</h5>
                <p class="card-text text-muted">Short description about this product.</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <strong>$29</strong>
                  <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-3 mb-4">
            <div class="card h-100 shadow-sm product-card">
              <img src="https://picsum.photos/400/300?prod2" class="card-img-top" alt="Product 2">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Product 2</h5>
                <p class="card-text text-muted">Another short description.</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <strong>$49</strong>
                  <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-3 mb-4">
            <div class="card h-100 shadow-sm product-card">
              <img src="https://picsum.photos/400/300?prod3" class="card-img-top" alt="Product 3">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Product 3</h5>
                <p class="card-text text-muted">Features & highlights.</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <strong>$19</strong>
                  <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-md-3 mb-4">
            <div class="card h-100 shadow-sm product-card">
              <img src="https://picsum.photos/400/300?prod4" class="card-img-top" alt="Product 4">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">Product 4</h5>
                <p class="card-text text-muted">Compact, reliable.</p>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <strong>$99</strong>
                  <button class="btn btn-sm btn-primary">Add to Cart</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
