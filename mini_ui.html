<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini UI</title>
<link rel="stylesheet" href="mini_ui.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>My App</h1>
      <nav><a href="#">Home</a></nav>
    </header>

    <main class="card">
      <h2>Contact Us</h2>
      <form>
        <div class="form-row">
          <input class="input" type="text" placeholder="Your name">
          <input class="input" type="email" placeholder="Email">
          <button class="btn">Send</button>
        </div>
      </form>
      <div style="margin-top:12px;display:flex;gap:12px;align-items:center">
        <img src="https://source.unsplash.com/64x64?logo" alt="logo" style="border-radius:6px">
        <p style="margin:0;color:#666">Small image inside card</p>
      </div>
    </main>

    <footer class="footer">&copy; 2025 My App</footer>
  </div>
</body>
</html>
