<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blog Pagination - Q9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q9_pagination.css">
  </head>
  <body>
    <main class="container py-5">
      <header class="text-center mb-4">
        <h1 class="mb-0">Blog</h1>
        <p class="text-muted">Latest posts</p>
      </header>

      <section class="mb-4">
        <article class="mb-3">
          <h4>Post Title One</h4>
          <p class="text-muted">Short excerpt for post one.</p>
        </article>
        <article class="mb-3">
          <h4>Post Title Two</h4>
          <p class="text-muted">Short excerpt for post two.</p>
        </article>
      </section>

      <!-- Pagination centered -->
      <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
          <li class="page-item">
            <a class="page-link" href="#">Previous</a>
          </li>
          <li class="page-item"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item">
            <a class="page-link" href="#">Next</a>
          </li>
        </ul>
      </nav>

      <!-- Pager below -->
      <div class="d-flex justify-content-center gap-2 mt-3">
        <button class="btn btn-outline-secondary">Older Posts</button>
        <button class="btn btn-outline-secondary">Newer Posts</button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
