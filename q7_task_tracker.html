<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Tracker - Q7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7_task_tracker.css">
  </head>
  <body>
    <header class="bg-white border-bottom py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Task Tracker</h4>
        <!-- Badge counter in header -->
        <div>Pending: <span class="badge bg-danger">4</span></div>
      </div>
    </header>

    <main class="container py-4">
      <div class="row">
        <div class="col-md-8">
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Fix navbar responsiveness
              <span class="badge bg-warning text-dark">High</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Write unit tests
              <span class="badge bg-info text-dark">Medium</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Update docs
              <span class="badge bg-secondary">Low</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Design new landing hero
              <span class="badge bg-warning text-dark">High</span>
            </li>
          </ul>

          <div class="mt-3">
            <!-- Completed button with embedded badge -->
            <button class="btn btn-success">Completed <span class="badge bg-light text-dark ms-2">2</span></button>
          </div>
        </div>

        <aside class="col-md-4">
          <div class="card p-3">
            <h5>Quick Stats</h5>
            <p>Open tasks: <strong>4</strong></p>
            <p>Completed today: <strong>2</strong></p>
          </div>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
